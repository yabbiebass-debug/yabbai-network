<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YABBAI Local</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--void:#020814;--void-2:#060e20;--void-3:#0d1a35;--sol-purple:#9945FF;
--sol-green:#14F195;--amber:#F5A623;--danger:#ef4444;--white:#e8f0ff;--muted:#4a6080;
--border-glow:rgba(153,69,255,0.35);--font-mono:'JetBrains Mono',monospace;--font-display:'Unbounded',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-mono);background:var(--void);color:var(--white);height:100vh;
display:flex;flex-direction:column;
background-image:radial-gradient(circle at 15% 10%,rgba(153,69,255,0.07),transparent 40%),
radial-gradient(circle at 85% 90%,rgba(20,241,149,0.05),transparent 40%)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;
border-bottom:1px solid var(--border-glow);flex-wrap:wrap;gap:8px}
.brand{font-family:var(--font-display);font-weight:900;font-size:20px}
.brand span{color:var(--sol-purple)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;letter-spacing:0.08em;padding:3px 8px;border-radius:4px;
border:1px solid var(--border-glow);color:var(--sol-green);text-transform:uppercase}
.badge-model{color:var(--sol-purple)}
#setup{background:rgba(245,166,35,0.08);border:1px solid var(--amber);color:var(--amber);
padding:10px 20px;font-size:12px;line-height:1.6}
#setup code{background:var(--void-3);padding:2px 6px;border-radius:3px;color:var(--white)}
.hidden{display:none}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:80%;padding:11px 15px;border-radius:10px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.user{align-self:flex-end;background:var(--void-3);border-radius:10px 10px 2px 10px}
.bot{align-self:flex-start;background:var(--void-2);border:1px solid var(--border-glow);border-radius:10px 10px 10px 2px}
.bot .meta{font-size:10px;color:var(--muted);margin-top:6px}
.cursor::after{content:'▋';animation:blink 1s infinite;color:var(--sol-green)}
@keyframes blink{50%{opacity:0}}
footer{padding:14px 20px;border-top:1px solid var(--border-glow);display:flex;gap:10px}
textarea{flex:1;background:var(--void-3);border:1px solid var(--border-glow);color:var(--white);
font-family:var(--font-mono);border-radius:6px;padding:10px 12px;resize:none;outline:none;font-size:14px;height:48px}
textarea:focus{border-color:var(--sol-purple)}
.btn{background:transparent;border:1px solid var(--sol-purple);color:var(--sol-purple);
font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:0.08em;
padding:0 18px;border-radius:6px;cursor:pointer;transition:all .15s}
.btn:hover{background:rgba(153,69,255,0.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
select{background:var(--void-3);border:1px solid var(--border-glow);color:var(--white);
font-family:var(--font-mono);font-size:11px;border-radius:4px;padding:4px 8px;outline:none}
.welcome{align-self:center;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;margin-top:40px;max-width:520px}
.welcome b{color:var(--sol-green)}
</style>
</head>
<body>
<header>
  <span class="brand">YABBAI <span>LOCAL</span></span>
  <div class="badges">
    <span class="badge">100% PRIVATE</span>
    <span class="badge">ON-DEVICE</span>
    <span class="badge badge-model" id="modelBadge">model: …</span>
    <select id="modelSelect" onchange="changeModel()"></select>
  </div>
</header>

<div id="setup" class="hidden"></div>

<div id="chat">
  <div class="welcome" id="welcome">
    <b>YABBAI Local</b> — your own AI, running entirely on this machine.<br>
    Nothing leaves your computer. No accounts, no API keys, no cloud.<br><br>
    Say <b>"remember that ..."</b> and I'll keep it in local memory.<br>
    Ask me anything to begin.
  </div>
</div>

<footer>
  <textarea id="input" placeholder="Message YABBAI Local…  (Enter to send, Shift+Enter for newline)"></textarea>
  <button class="btn" id="sendBtn" onclick="send()">Send</button>
  <button class="btn" onclick="resetChat()">Reset</button>
</footer>

<script>
const API = (window.YABBAI_API || '');
let busy = false;

async function boot(){
  // models
  try{
    const m = await fetch(API+'/api/models').then(r=>r.json());
    document.getElementById('modelBadge').textContent = 'model: '+m.current;
    const sel = document.getElementById('modelSelect');
    const opts = [...new Set([m.current, ...m.alternatives, ...m.installed])];
    sel.innerHTML = opts.map(o=>`<option ${o===m.current?'selected':''}>${o}</option>`).join('');
  }catch(e){}
  // setup status
  checkSetup();
  setInterval(()=>{if(!document.hidden)checkSetup();},15000);
}

async function checkSetup(){
  try{
    const s = await fetch(API+'/api/setup').then(r=>r.json());
    const el = document.getElementById('setup');
    if(s.ready){ el.classList.add('hidden'); }
    else{
      el.classList.remove('hidden');
      let extra = '';
      if(s.stage==='ollama_not_running') extra = ' Download: <code>ollama.com</code>';
      el.innerHTML = '⚠ ' + s.message + extra;
    }
  }catch(e){
    const el = document.getElementById('setup');
    el.classList.remove('hidden');
    el.innerHTML = '⚠ Cannot reach YABBAI Local server. Is it running on port 7860?';
  }
}

async function changeModel(){
  const model = document.getElementById('modelSelect').value;
  await fetch(API+'/api/model',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model})});
  document.getElementById('modelBadge').textContent = 'model: '+model;
  checkSetup();
}

function addMsg(text, who, meta){
  const w = document.getElementById('welcome'); if(w) w.remove();
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg '+(who==='user'?'user':'bot');
  div.textContent = text;
  if(meta){ const m=document.createElement('div'); m.className='meta'; m.textContent=meta; div.appendChild(m); }
  chat.appendChild(div); chat.scrollTop = chat.scrollHeight;
  return div;
}

async function send(){
  if(busy) return;
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  addMsg(text,'user');
  busy = true; document.getElementById('sendBtn').disabled = true;

  const botDiv = addMsg('', 'bot');
  botDiv.classList.add('cursor');

  try{
    const r = await fetch(API+'/api/chat/stream',{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text})});
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let full = '';
    while(true){
      const {done,value} = await reader.read();
      if(done) break;
      full += dec.decode(value,{stream:true});
      botDiv.textContent = full;
      document.getElementById('chat').scrollTop = 1e9;
    }
    botDiv.classList.remove('cursor');
  }catch(e){
    botDiv.classList.remove('cursor');
    botDiv.textContent = 'Error reaching local model: '+e.message;
  }
  busy = false; document.getElementById('sendBtn').disabled = false;
}

async function resetChat(){
  await fetch(API+'/api/reset',{method:'POST'});
  document.getElementById('chat').innerHTML='';
  location.reload();
}

document.getElementById('input').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

boot();
</script>
</body>
</html>
