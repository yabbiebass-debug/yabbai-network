<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YABBAI.NETWORK — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--void:#020814;--panel:#081226;--panel2:#0c1a38;--line:rgba(153,69,255,.18);
    --purple:#9945FF;--green:#14F195;--ink:#EEF1FB;--dim:#9AA3C0;--dim2:#5e6688;
    --disp:'Unbounded',sans-serif;--mono:'JetBrains Mono',monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--void);color:var(--ink);font-family:var(--mono);font-size:13px}
  body{background:radial-gradient(1100px 600px at 50% -10%,rgba(153,69,255,.12),transparent 60%),var(--void);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:22px}
  .gate{border:1px solid var(--line);background:var(--panel);padding:40px 36px;max-width:440px;width:100%;border-radius:8px;text-align:center}
  .brand{font-family:var(--disp);font-weight:800;font-size:20px;margin-bottom:6px}.brand b{color:var(--purple)}
  .brand small{display:block;font-weight:400;font-size:9px;color:var(--dim2);letter-spacing:3px;margin-top:6px;text-transform:uppercase}
  .lead{font-family:var(--disp);font-size:17px;margin:22px 0 6px;line-height:1.25}
  .lead em{color:var(--green);font-style:normal}
  p{font-size:11.5px;color:var(--dim);margin-bottom:22px;line-height:1.7}
  .gbtn{display:inline-flex;align-items:center;gap:12px;width:100%;justify-content:center;
    padding:13px 18px;border:1px solid var(--purple);color:var(--ink);background:transparent;
    border-radius:4px;font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:1.5px;
    text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
  .gbtn:hover{background:var(--purple);color:#fff}
  .gbtn svg{width:18px;height:18px}
  .status{font-size:10px;color:var(--dim2);margin-top:14px;min-height:14px}
  .foot{margin-top:26px;font-size:9px;color:var(--dim2);letter-spacing:1.5px;text-transform:uppercase}
</style>
</head>
<body>
  <div class="gate">
    <div class="brand">YABBAI<b>.</b>NETWORK<small>All surfaces · one sign-in</small></div>
    <div class="lead">One civilisation. <em>One sign-in.</em></div>
    <p>Sign in with Google to enter the network — the twelve-agent clan, the truth ledger, the routed brain and every surface in formation.</p>
    <button class="gbtn" id="google" data-testid="google-signin">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.6 6.1 29 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.6 6.1 29 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-2.6-11.3-6.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41.6 35.8 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="status" id="status"></div>
    <div class="foot">BASHAM Automations · Melbourne</div>
  </div>
<script>
const ORIGIN = window.location.origin;
// If already signed in, go straight to the hub.
(async () => {
  try {
    const r = await fetch(ORIGIN + '/api/auth/me', { credentials: 'include' });
    if (r.ok) window.location.replace('/hub/index.html');
  } catch (e) {}
})();

document.getElementById('google').onclick = () => {
  document.getElementById('status').textContent = 'Redirecting to Google…';
  // REMINDER: DO NOT HARDCODE THE URL, OR ADD ANY FALLBACKS OR REDIRECT URLS, THIS BREAKS THE AUTH
  const redirectUrl = ORIGIN + '/hub/index.html';
  window.location.href = 'https://auth.emergentagent.com/?redirect=' + encodeURIComponent(redirectUrl);
};
</script>
</body>
</html>
